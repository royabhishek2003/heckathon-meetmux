services:
  neo4j:
    image: neo4j:5.15-community
    container_name: meetmux-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - ./backend/data/neo4j:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - supply_chain_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetmux-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_DEBUG=${APP_DEBUG:-true}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - ROUTE_PROVIDER=${ROUTE_PROVIDER:-mock}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-http://router.project-osrm.org}
      - MODEL_ARTIFACT_PATH=${MODEL_ARTIFACT_PATH:-models/delay_model_v0.1.0.joblib}
      - MODEL_VERSION=${MODEL_VERSION:-0.1.0}
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:80"]
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend/models:/app/models
    networks:
      - supply_chain_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetmux-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - supply_chain_net

volumes:
  neo4j_data:
    driver: local

networks:
  supply_chain_net:
    driver: bridge
