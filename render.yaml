services:
  # ── Backend Web Service (FastAPI) ─────────────────────
  - type: web
    name: meetmux-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: ROUTE_PROVIDER
        value: mock
      - key: MODEL_ARTIFACT_PATH
        value: models/delay_model_v0.1.0.joblib
      - key: MODEL_VERSION
        value: "0.1.0"
      # Optional Neo4j connection (falls back to in-memory demo data if empty)
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j

  # ── Frontend Static Site (React + Vite) ───────────────
  - type: web
    name: meetmux-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: meetmux-backend
          property: host
